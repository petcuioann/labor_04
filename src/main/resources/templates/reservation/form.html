<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Edit Reservation' : 'Create Reservation'">Reservation Form</title>
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit Reservation' : 'Create New Reservation'">Reservation Form</h1>
    <form th:action="${editMode} ? @{'/reservations/' + ${reservation.id} + '/edit'} : @{/reservations}" th:object="${reservation}" method="post">
        <div>
            <label for="memberId">Member:</label>
            <select id="memberId" th:field="*{memberId}" required>
                <option th:each="member : ${members}" th:value="${member.id}" th:text="${member.name + ' (' + member.id + ')'}"></option>
            </select>
        </div>
        <div>
            <label for="readableItemId">Readable Item:</label>
            <select id="readableItemId" th:field="*{readableItemId}" required>
                <option th:each="item : ${availableItems}" th:value="${item.id}" th:text="${item.barcode + ' (' + item.publicationId + ')'}"></option>
            </select>
        </div>
        <div th:if="${editMode}">
            <label for="date">Date:</label>
            <input type="date" id="date" th:field="*{date}" required>
        </div>
        <div th:if="${editMode}">
            <label for="status">Status:</label>
            <select id="status" th:field="*{status}" required>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/reservations}">Cancel</a>
        </div>
    </form>
</body>
</html>
