<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Member</title>
</head>
<body>
    <h1>Register New Member</h1>
    <form th:action="@{/members}" th:object="${member}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>
        <div>
            <label for="libraryId">Library:</label>
            <select id="libraryId" th:field="*{libraryId}" required>
                <option th:each="lib : ${libraries}" th:value="${lib.id}" th:text="${lib.name + ' (' + lib.id + ')'}"></option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/members}">Cancel</a>
        </div>
    </form>
</body>
</html>
