<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Book</title>
</head>
<body>
    <h1>Create New Book</h1>
    <form th:action="@{/books}" th:object="${book}" method="post">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div>
            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" th:field="*{isbn}" required>
        </div>
        <div>
            <label for="pageCount">Page Count:</label>
            <input type="number" id="pageCount" th:field="*{pageCount}" min="1" required>
        </div>
        <div>
            <label for="authorId">Author (optional):</label>
            <select id="authorId" name="authorId">
                <option value="">-- None --</option>
                <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}"></option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/books}">Cancel</a>
        </div>
    </form>
</body>
</html>
