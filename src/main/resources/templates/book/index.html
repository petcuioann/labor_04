<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Dashboard</a> |
        <a th:href="@{/libraries}">Libraries</a> |
        <a th:href="@{/authors}">Authors</a> |
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/items}">Items</a> |
        <a th:href="@{/members}">Members</a> |
        <a th:href="@{/loans}">Loans</a> |
        <a th:href="@{/reservations}">Reservations</a>
    </nav>
    <h1>Books</h1>
    <p><a th:href="@{/books/new}">Create New Book</a></p>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>ISBN</th>
                <th>Pages</th>
                <th>Total Copies</th>
                <th>Available Copies</th>
                <th>Linked Authors</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.pageCount}"></td>
                <td th:text="${book.copies.size()}"></td>
                <td th:text="${book.availableCopies()}"></td>
                <td th:text="${book.bookAuthors.size()}"></td>
                <td>
                    <form th:action="@{'/books/' + ${book.id} + '/delete'}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
