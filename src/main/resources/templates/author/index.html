<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Dashboard</a> |
        <a th:href="@{/libraries}">Libraries</a> |
        <a th:href="@{/authors}">Authors</a> |
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/items}">Items</a> |
        <a th:href="@{/members}">Members</a> |
        <a th:href="@{/loans}">Loans</a> |
        <a th:href="@{/reservations}">Reservations</a>
    </nav>
    <h1>Authors</h1>
    <p><a th:href="@{/authors/new}">Create New Author</a></p>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Linked Books</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="author : ${authors}">
                <td th:text="${author.id}"></td>
                <td th:text="${author.name}"></td>
                <td th:text="${author.books.size()}"></td>
                <td>
                    <form th:action="@{'/authors/' + ${author.id} + '/delete'}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
