<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Edit Author' : 'Create Author'">Author Form</title>
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit Author' : 'Create New Author'">Author Form</h1>
    <form th:action="${editMode} ? @{'/authors/' + ${author.id} + '/edit'} : @{/authors}" th:object="${author}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/authors}">Cancel</a>
        </div>
    </form>
</body>
</html>
