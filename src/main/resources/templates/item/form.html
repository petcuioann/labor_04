<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Edit Readable Item' : 'Create Readable Item'">Readable Item Form</title>
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit Readable Item' : 'Create New Readable Item'">Readable Item Form</h1>
    <form th:action="${editMode} ? @{'/items/' + ${item.id} + '/edit'} : @{/items}" th:object="${item}" method="post">
        <div>
            <label for="barcode">Barcode:</label>
            <input type="text" id="barcode" th:field="*{barcode}" required>
        </div>
        <div>
            <label for="publicationId">Publication:</label>
            <select id="publicationId" th:field="*{publicationId}" required>
                <option th:each="pub : ${publications}" th:value="${pub.id}" th:text="${pub.title + ' (' + pub.id + ')'}"></option>
            </select>
        </div>
        <div>
            <label for="libraryId">Library:</label>
            <select id="libraryId" name="libraryId" required>
                <option th:each="lib : ${libraries}" th:value="${lib.id}" th:text="${lib.name + ' (' + lib.id + ')'}" th:selected="${lib.id == selectedLibraryId}"></option>
            </select>
        </div>
        <div th:if="${editMode}">
            <label for="status">Status:</label>
            <select id="status" th:field="*{status}" required>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/items}">Cancel</a>
        </div>
    </form>
</body>
</html>
