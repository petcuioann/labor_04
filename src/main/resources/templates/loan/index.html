<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loans</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Dashboard</a> |
        <a th:href="@{/libraries}">Libraries</a> |
        <a th:href="@{/authors}">Authors</a> |
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/items}">Items</a> |
        <a th:href="@{/members}">Members</a> |
        <a th:href="@{/loans}">Loans</a> |
        <a th:href="@{/reservations}">Reservations</a>
    </nav>
    <h1>Loans</h1>
    <p><a th:href="@{/loans/new}">Create New Loan</a></p>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Member ID</th>
                <th>Loan Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Items Count</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="loan : ${loans}">
                <td th:text="${loan.id}"></td>
                <td th:text="${loan.memberId}"></td>
                <td th:text="${loan.date}"></td>
                <td th:text="${loan.dueDate}"></td>
                <td th:text="${loan.returnDate != null ? loan.returnDate : 'Active'}"></td>
                <td th:text="${loan.items.size()}"></td>
                <td>
                    <form th:action="@{'/loans/' + ${loan.id} + '/delete'}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
