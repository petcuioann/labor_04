<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Loan</title>
</head>
<body>
    <h1>Create New Loan</h1>
    <form th:action="@{/loans}" method="post">
        <div>
            <label for="memberId">Member:</label>
            <select id="memberId" name="memberId" required>
                <option th:each="member : ${members}" th:value="${member.id}" th:text="${member.name + ' (' + member.id + ')'}"></option>
            </select>
        </div>
        <div>
            <label for="itemIds">Available Items:</label>
            <select id="itemIds" name="itemIds" multiple required>
                <option th:each="item : ${availableItems}" th:value="${item.id}" th:text="${item.barcode + ' (' + item.publicationId + ')'}"></option>
            </select>
        </div>
        <div>
            <label for="dueDate">Due Date:</label>
            <input type="date" id="dueDate" name="dueDate" th:value="${defaultDueDate}" required>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/loans}">Cancel</a>
        </div>
    </form>
</body>
</html>
