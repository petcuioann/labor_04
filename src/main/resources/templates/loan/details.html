<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loan Details</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Dashboard</a> |
        <a th:href="@{/libraries}">Libraries</a> |
        <a th:href="@{/authors}">Authors</a> |
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/items}">Items</a> |
        <a th:href="@{/members}">Members</a> |
        <a th:href="@{/loans}">Loans</a> |
        <a th:href="@{/reservations}">Reservations</a>
    </nav>
    <h1>Loan Details</h1>
    <p><strong>ID:</strong> <span th:text="${loan.id}"></span></p>
    <p><strong>Member ID:</strong> <span th:text="${loan.memberId}"></span></p>
    <p><strong>Loan Date:</strong> <span th:text="${loan.date}"></span></p>
    <p><strong>Due Date:</strong> <span th:text="${loan.dueDate}"></span></p>
    <p><strong>Return Date:</strong> <span th:text="${loan.returnDate != null ? loan.returnDate : 'Active'}"></span></p>
    <p><strong>Items Count:</strong> <span th:text="${loan.items.size()}"></span></p>
    <p>
        <a th:href="@{'/loans/' + ${loan.id} + '/edit'}">Edit</a> |
        <a th:href="@{/loans}">Back to List</a>
    </p>
</body>
</html>
