<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Edit Library' : 'Create Library'">Library Form</title>
</head>
<body>
    <h1 th:text="${editMode} ? 'Edit Library' : 'Create New Library'">Library Form</h1>
    <form th:action="${editMode} ? @{'/libraries/' + ${library.id} + '/edit'} : @{/libraries}" th:object="${library}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div>
            <label for="address">Address:</label>
            <input type="text" id="address" th:field="*{address}" required>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/libraries}">Cancel</a>
        </div>
    </form>
</body>
</html>
